<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | MediCare</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            💊 MediCare
        </div>

        <h1>Create Account</h1>

        <p class="auth-subtitle">
            Start managing your medicine schedule.
        </p>


        {% with messages = get_flashed_messages() %}

            {% if messages %}

                <div class="message">

                    {% for message in messages %}
                        {{ message }}
                    {% endfor %}

                </div>

            {% endif %}

        {% endwith %}


        <form method="POST">

            <label>Full Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >


            <label>Email Address</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Minimum 6 characters"
                required
            >


            <button type="submit"
                    class="auth-btn">

                Create Account

            </button>

        </form>


        <p class="auth-footer">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>

    </div>

</div>

</body>

</html>
