<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | MediCare</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            💊 MediCare
        </div>

        <h1>Welcome Back</h1>

        <p class="auth-subtitle">
            Login to your medicine dashboard.
        </p>


        {% with messages = get_flashed_messages() %}

            {% if messages %}

                <div class="message">

                    {% for message in messages %}
                        {{ message }}
                    {% endfor %}

                </div>

            {% endif %}

        {% endwith %}


        <form method="POST">

            <label>Email Address</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit"
                    class="auth-btn">

                Login

            </button>

        </form>


        <p class="auth-footer">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create Account
            </a>

        </p>

    </div>

</div>

</body>

</html>
